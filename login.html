<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Eastworld</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-overlay"></div>
      <img src="https://images.unsplash.com/photo-1492571350019-22de08371fd3?ixlib=rb-1.2.1&auto=format&fit=crop&w=1953&q=80" alt="Asian Street">
    </div>
    <div class="auth-right">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">EASTWORLD</a>
      </div>
      <div class="auth-form-container">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue to Eastworld</p>
        
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Email" required>
          </div>
          <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
            <i class="fas fa-eye-slash toggle-password"></i>
          </div>
          
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-button">
            <span>Sign In</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="social-auth">
          <p>Or continue with</p>
          <div class="social-buttons">
            <button class="social-button google">
              <i class="fab fa-google"></i>
              <span>Google</span>
            </button>
            <button class="social-button apple">
              <i class="fab fa-apple"></i>
              <span>Apple</span>
            </button>
          </div>
        </div>

        <p class="auth-redirect">
          Don't have an account? <a href="register.html">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
