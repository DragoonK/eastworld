<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eastworld - Latest in Asian Culture</title>
  <meta name="description" content="Eastworld is your premier destination for Asian culture, food, stays, places and products — city guides, trending picks and stories from Japan, China, Vietnam, Cambodia and beyond.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Eastworld">
  <meta property="og:title" content="Eastworld - Latest in Asian Culture">
  <meta property="og:description" content="City guides, trending picks and stories from Japan, China, Vietnam, Cambodia and beyond.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <header>
    <nav class="main-nav">
      <div class="nav-links">
        <a href="food.html">FOOD</a>
        <a href="stays.html">STAYS</a>
        <a href="places.html">PLACES</a>
        <a href="products.html">PRODUCTS</a>
        <a href="cities.html">CITIES</a>
      </div>
      <a href="index.html" class="logo">EASTWORLD</a>
      <div class="nav-links">
        <a href="ew-events.html">EW EVENTS</a>
        <a href="community.html">EW HUB</a>
        <a href="login.html" class="auth-link">LOGIN</a>
        <a href="register.html" class="auth-link">REGISTER</a>
      </div>
    </nav>
  </header>

  <!-- Reserved slots for Google ads; visible on screens wider than 1400px -->
  <aside class="ad-rail left">AD</aside>
  <aside class="ad-rail right">AD</aside>

  <main class="page">
   <div class="layout">

    <!-- LEFT COLUMN: top carousel, stories, bottom carousel -->
    <div class="main-col">

    <!-- Top carousel: slides managed in the admin's CAROUSELS tab -->
    <section class="carousel" data-slides="top" aria-label="Spotlights">
      <div class="carousel-track"></div>
      <button class="carousel-button prev" aria-label="Previous slide">&#8249;</button>
      <button class="carousel-button next" aria-label="Next slide">&#8250;</button>
      <div class="carousel-indicators"></div>
    </section>

    <!-- Blog posts, loaded from the backend API (infinite scroll) -->
    <section class="posts-section">
      <h2>LATEST STORIES</h2>
      <div id="posts-grid" class="posts-grid">
        <p class="posts-status">Loading stories&hellip;</p>
      </div>
      <!-- Invisible marker: when it scrolls into view, 5 more posts load -->
      <div id="posts-sentinel"></div>
    </section>

    <!-- Bottom carousel: slides managed in the admin's CAROUSELS tab -->
    <section class="carousel" data-slides="bottom" aria-label="City guides">
      <div class="carousel-track"></div>
      <button class="carousel-button prev" aria-label="Previous slide">&#8249;</button>
      <button class="carousel-button next" aria-label="Next slide">&#8250;</button>
      <div class="carousel-indicators"></div>
    </section>

    </div><!-- /main-col -->

    <!-- RIGHT COLUMN: video rail + trending top five -->
    <div class="side-col">

    <!-- Video rail: the first video from the admin's VIDEOS tab; hidden if empty -->
    <aside class="video-rail" id="video-rail" hidden>
      <div class="video-rail-header">
        <h2>WATCH</h2>
      </div>
      <div id="video-main" class="video-main"></div>
    </aside>

    <aside class="trending">
      <div class="trending-header">
        <h2>TRENDING</h2>
        <select id="trending-country">
          <option value="all">All Countries</option>
          <option value="japan">Japan</option>
          <option value="china">China</option>
          <option value="vietnam">Vietnam</option>
          <option value="australia">Australia</option>
          <option value="cambodia">Cambodia</option>
        </select>
      </div>
      <div class="trending-tabs">
        <button class="trending-tab active" data-tab="food">FOOD</button>
        <button class="trending-tab" data-tab="stays">STAYS</button>
        <button class="trending-tab" data-tab="places">PLACES</button>
        <button class="trending-tab" data-tab="products">PRODUCTS</button>
      </div>
      <div id="trending-list" class="trending-list"></div>
    </aside>

    </div><!-- /side-col -->

   </div><!-- /layout -->
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h3>ABOUT EASTWORLD</h3>
        <p>Your premier destination for Asian culture, style, and trends.</p>
      </div>
      <div class="footer-section">
        <h3>FOLLOW US</h3>
        <p><a href="#">Instagram</a> &middot; <a href="#">Twitter</a> &middot; <a href="#">Facebook</a></p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Eastworld. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script src="trending.js"></script>
</body>
</html>
