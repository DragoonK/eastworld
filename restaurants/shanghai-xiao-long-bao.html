<!DOCTYPE html>
<html lang="en" class="content-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaolongbao - Eastworld Shanghai Restaurant Guide</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .dumpling-process {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 2rem 0;
    }
    
    .process-step {
      text-align: center;
      padding: 1rem;
    }
    
    .process-step img {
      height: 80px;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="content-container">
    <div class="content-header">
      <span class="content-category">STREET FOOD</span>
      <h1 class="content-title">Xiaolongbao - Shanghai's Soup Dumpling Masters</h1>
      <div class="rating">★★★★☆ 4.3/5.0</div>
    </div>

    <div class="hero-container">
      <img class="content-hero" src="https://www.saveur.com/uploads/2019/02/18/YN7O4ST5KRFM3D4QDX7Q43D6HY.jpg" alt="Xiaolongbao dumplings" 
      onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\'background:#FFF3E0; color:black; padding:2rem; text-align:center\'>Xiaolongbao Specialists</div>';">
    </div>

    <div class="content-text">
      <h2>Making Process</h2>
      <div class="dumpling-process">
        <div class="process-step">
          <img src="https://example.com/dough.jpg" alt="Dough preparation">
          <p>Dough Kneading</p>
        </div>
        <!-- More steps -->
      </div>
    </div>
  </main>
</body>
</html>
