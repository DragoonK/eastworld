<!DOCTYPE html>
<html lang="en" class="content-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultraviolet - Eastworld Shanghai Restaurant Guide</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .sensory-experience {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin: 2rem 0;
    }
    
    .sensory-element {
      padding: 1.5rem;
      background: #1a1a1a;
      color: white;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="content-container">
    <div class="content-header">
      <span class="content-category">FINE DINING</span>
      <h1 class="content-title">Ultraviolet - Shanghai's Multi-Sensory Culinary Journey</h1>
      <div class="rating">★★★★★ 4.9/5.0</div>
    </div>

    <div class="hero-container">
      <img class="content-hero" src="https://www.uvbypp.cc/images/uv/gallery/01.jpg" alt="Ultraviolet dining room" 
      onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\'background:#000; color:white; padding:2rem; text-align:center\'>Ultraviolet Experience</div>';">
    </div>

    <div class="restaurant-info">
      <div class="restaurant-details">
        <div class="detail-row">
          <div class="detail-label">Address:</div>
          <div class="detail-value">Secret Location (Disclosed upon booking)</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Experience:</div>
          <div class="detail-value">20-course immersive tasting menu</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
