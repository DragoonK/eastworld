<!DOCTYPE html>
<html lang="en" class="content-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fu 1088 - Eastworld Shanghai Restaurant Guide</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .timeline {
      border-left: 3px solid #8b0000;
      padding-left: 2rem;
      margin: 2rem 0;
    }
    
    .timeline-event {
      margin-bottom: 2rem;
      position: relative;
    }
    
    .timeline-event::before {
      content: "";
      width: 12px;
      height: 12px;
      background: #8b0000;
      position: absolute;
      left: -2.4rem;
      top: 4px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main class="content-container">
    <div class="content-header">
      <span class="content-category">HISTORIC MANSION</span>
      <h1 class="content-title">Fu 1088 - Republican-Era Shanghai Cuisine</h1>
      <div class="rating">★★★★☆ 4.7/5.0</div>
    </div>

    <div class="hero-container">
      <img class="content-hero" src="https://www.fu1088.com/images/slider/1.jpg" alt="Fu 1088 mansion exterior" 
      onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\'background:#8b0000; color:white; padding:2rem; text-align:center\'>Fu 1088</div>';">
    </div>

    <div class="content-text">
      <h2>Historical Timeline</h2>
      <div class="timeline">
        <div class="timeline-event">
          <h3>1930</h3>
          <p>Villa construction completed</p>
        </div>
        <!-- More timeline events -->
      </div>
    </div>
  </main>
</body>
</html>
