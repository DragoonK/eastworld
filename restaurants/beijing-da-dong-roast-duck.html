<!DOCTYPE html>
<html lang="en" class="content-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Da Dong Roast Duck - Eastworld Beijing Restaurant Guide</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .duck-carving {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin: 2rem 0;
    }
    
    .carving-step {
      text-align: center;
      border: 1px solid #e0e0e0;
      padding: 1rem;
      border-radius: 8px;
    }
    
    .carving-step img {
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="content-container">
    <div class="content-header">
      <span class="content-category">PEKING DUCK</span>
      <h1 class="content-title">Da Dong - Revolutionizing Beijing's Roast Duck Tradition</h1>
      <div class="rating">★★★★★ 4.7/5.0</div>
    </div>

    <div class="hero-container">
      <img class="content-hero" src="https://www.timeoutbeijing.com/wp-content/uploads/2017/09/Da-Dong-Super-Lean-Roast-Duck.jpg" alt="Da Dong's signature roast duck" 
      onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\'background:#8b0000; color:white; padding:2rem; text-align:center\'>Da Dong Roast Duck</div>';">
    </div>

    <div class="restaurant-info">
      <div class="restaurant-details">
        <h2>Restaurant Details</h2>
        <div class="detail-row">
          <div class="detail-label">Address:</div>
          <div class="detail-value">1-2/F, Nanxincang International Plaza, 22A Dongsishitiao, Dongcheng District</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Signature Dish:</div>
          <div class="detail-value">Super Lean Roast Duck (烤鸭)</div>
        </div>
      </div>
      <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3055.325430879693!2d116.40658931536389!3d39.9411919794216!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x35f052e7a7360e3d%3A0x5d1a1a0a1a0a1a0a!2sDa%20Dong%20Roast%20Duck!5e0!3m2!1sen!2scn!4v1693230090086!5m2!1sen!2scn" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>
  </main>
</body>
</html>
