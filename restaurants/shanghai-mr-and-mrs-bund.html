<!DOCTYPE html>
<html lang="en" class="content-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr & Mrs Bund - Eastworld Shanghai Restaurant Guide</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .menu-highlights {
      column-count: 2;
      column-gap: 2rem;
      margin: 2rem 0;
    }
    
    .menu-item {
      break-inside: avoid;
      padding: 1rem 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <main class="content-container">
    <div class="content-header">
      <span class="content-category">MODERN FRENCH</span>
      <h1 class="content-title">Mr & Mrs Bund - Parisian Brasserie on the Huangpu</h1>
      <div class="rating">★★★★★ 4.8/5.0</div>
    </div>

    <div class="hero-container">
      <img class="content-hero" src="https://www.mmbund.com/images/slider/1.jpg" alt="Mr & Mrs Bund dining room" 
      onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\'background:#2F4F4F; color:white; padding:2rem; text-align:center\'>Mr & Mrs Bund</div>';">
    </div>

    <div class="content-text">
      <h2>Signature Dishes</h2>
      <div class="menu-highlights">
        <div class="menu-item">
          <h3>Lemon Pie</h3>
          <p>6-hour cooked lemon cream</p>
        </div>
        <!-- More menu items -->
      </div>
    </div>
  </main>
</body>
</html>
